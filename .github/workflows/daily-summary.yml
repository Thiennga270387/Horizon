name: Daily Horizon Summary

on:
  schedule:
  - cron: '0 1 * * *'  # Runs every day at 01:00 UTC
  workflow_dispatch:      # Allow manual trigger

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run Horizon
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run horizon --hours 48

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true

      - name: Send Telegram Message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATE: ${{ env.DATE }}
        run: |
          python3 - <<'EOF'
          import os, re, json, urllib.request

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id   = os.environ["TELEGRAM_CHAT_ID"]
          date      = os.environ.get("DATE", "")
          page_url  = f"https://Tradingliving.github.io/Horizon/"

          # Try English summary first, then Chinese
          content = ""
          for lang in ("en", "zh"):
              path = f"docs/_posts/{date}-summary-{lang}.md"
              if os.path.exists(path):
                  with open(path, encoding="utf-8") as f:
                      raw = f.read()
                  # Strip Jekyll front matter (--- ... ---)
                  content = re.sub(r"^---\n.*?\n---\n*", "", raw, flags=re.DOTALL).strip()
                  break

          if content:
              # Telegram limit is 4096 chars; leave room for footer
              if len(content) > 3800:
                  content = content[:3800] + "..."
              message = f"{content}\n\n🔗 {page_url}"
          else:
              message = f"📰 Horizon Daily Summary — {date}\n🔗 {page_url}"

          payload = json.dumps({
              "chat_id":    chat_id,
              "text":       message,
              "parse_mode": "Markdown",
          }).encode("utf-8")

          req = urllib.request.Request(
              f"https://api.telegram.org/bot{bot_token}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print("✅ Telegram message sent, status:", resp.status)
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print("❌ Telegram error:", e.code, body)
              # Retry without Markdown if parse error
              if "parse" in body.lower() or "can't parse" in body.lower():
                  payload2 = json.dumps({
                      "chat_id": chat_id,
                      "text":    f"📰 Horizon Daily Summary — {date}\n🔗 {page_url}",
                  }).encode("utf-8")
                  req2 = urllib.request.Request(
                      f"https://api.telegram.org/bot{bot_token}/sendMessage",
                      data=payload2,
                      headers={"Content-Type": "application/json"},
                  )
                  with urllib.request.urlopen(req2) as r:
                      print("✅ Fallback message sent, status:", r.status)
          EOF
